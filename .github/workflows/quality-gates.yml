name: Quality gates

# Reusable in-repo quality gates (E-CI / policy C-A). Downloads coverage-xml
# published by python-gates (3.11 oracle cell). Hard enforcement path; Sonar
# stays soft in sonar.yml.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-repo
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node quality-gate tools (jscpd)
        run: npm ci

      - name: Download coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Resolve new-code compare ref
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            REF="$(git merge-base HEAD "origin/$BASE_REF")"
          else
            REF="$PUSH_BEFORE"
            if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
              git fetch origin main --depth=1
              REF="$(git merge-base HEAD origin/main || git rev-parse origin/main)"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "compare_ref=$REF"

      - name: doc-engine quality-gates (coverage / duplication / complexity / cycles)
        env:
          COMPARE_REF: ${{ steps.compare.outputs.ref }}
        run: |
          doc-engine quality-gates \
            --compare-ref "$COMPARE_REF" \
            --coverage-xml coverage.xml
