name: CodeQL signals

# Reusable CodeQL pack gates (E-CI / policy C-A). Called from ci.yml.
# Bundle pin lives here (this BC owns the CodeQL jobs). Digest provenance:
# digest field of codeql-bundle-linux64.tar.gz on the matching release tag.
#
# E-CQL1: fingerprint gate skips compile+runtime when CI harness inputs are
# byte-identical to base. Invariants always run. Wipe+rebuild of the fixture
# DB remains correct *when* runtime runs (hermetic dirty path).

on:
  workflow_call:

permissions:
  contents: read

env:
  CODEQL_SHA256: cb361567fa1bdb9d322da4240f621b36f245e4d7bb97db3c3a2ad7f743c8e8e7
  CODEQL_BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.2/codeql-bundle-linux64.tar.gz

jobs:
  codeql-signals-gate:
    runs-on: ubuntu-latest
    outputs:
      run_expensive: ${{ steps.gate.outputs.run_expensive }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Content fingerprint (skip expensive jobs when unchanged)
        id: gate
        run: |
          python3 scripts/ci/codeql_signals_change_gate.py \
            --base origin/main \
            --write-env

  codeql-signals-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: spring-signals static invariants
        run: python3 spring-signals/harness/check-invariants.py

  codeql-signals-compile:
    runs-on: ubuntu-latest
    needs: codeql-signals-gate
    if: needs.codeql-signals-gate.outputs.run_expensive == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up CodeQL
        uses: ./.github/actions/setup-codeql
        with:
          bundle-url: ${{ env.CODEQL_BUNDLE_URL }}
          bundle-sha256: ${{ env.CODEQL_SHA256 }}

      - name: Check CodeQL version
        run: codeql --version

      - name: Upload CodeQL bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-bundle
          path: ${{ runner.temp }}/codeql/codeql-bundle.tar.gz
          retention-days: 1

      - name: Install pack dependencies
        working-directory: spring-signals/codeql
        # --no-strict-mode: lock pins match the pinned CodeQL bundle's
        # qlpacks (resolved from the CLI dist, which strict mode labels as
        # --additional-packs). Prefer that over re-downloading from ghcr.
        run: |
          codeql pack install --no-strict-mode packs/java-signals-lib
          codeql pack install --no-strict-mode packs/spring-signals
          codeql pack install --no-strict-mode packs/spring-signals/test

      - name: Compile spring-signals queries
        working-directory: spring-signals/codeql
        run: |
          codeql query compile --check-only --threads=0 \
            packs/spring-signals/*.ql

      - name: Run spring-signals QL tests
        working-directory: spring-signals/codeql
        run: |
          codeql test run --threads=0 \
            packs/spring-signals/test

  codeql-signals-runtime:
    runs-on: ubuntu-latest
    needs:
      - codeql-signals-gate
      - codeql-signals-compile
    if: needs.codeql-signals-gate.outputs.run_expensive == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Print Java toolchain
        run: |
          echo "javac: $(which javac)"
          javac -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Download CodeQL bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-bundle
          path: ${{ runner.temp }}/codeql-artifact/

      - name: Set up CodeQL
        uses: ./.github/actions/setup-codeql
        with:
          bundle-path: ${{ runner.temp }}/codeql-artifact/codeql-bundle.tar.gz
          bundle-sha256: ${{ env.CODEQL_SHA256 }}

      - name: Check CodeQL version
        run: codeql --version

      - name: Install pack dependencies
        working-directory: spring-signals/codeql
        run: |
          codeql pack install --no-strict-mode packs/java-signals-lib
          codeql pack install --no-strict-mode packs/spring-signals

      - name: Run spring-signals fixture runtime gate
        working-directory: spring-signals/harness
        run: ./create-test-db.sh
