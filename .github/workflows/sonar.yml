name: SonarCloud (soft)

# Soft SonarCloud signal only (E-CI / policy C-A). Free-plan Quality Gates
# cannot enforce this repo's thresholds; hard fail lives in quality-gates.yml.
# Caller sets continue-on-error so Sonar never blocks merges.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: "SonarCloud (non-blocking; Free QG not policy SoT)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Require coverage.xml for Sonar
        run: |
          test -f coverage.xml
          python3 scripts/ci/coverage_run_summary.py --print-line-rate

      - name: SonarQube Scan (non-blocking)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=false
