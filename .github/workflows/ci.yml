name: CI

# Orchestration-only caller (E-CI policy C-A). Gate logic lives in reusable
# workflows under .github/workflows/, composites under .github/actions/, and
# scripts under scripts/ci / doc-engine CLIs. See CONTRIBUTING.md "CI layering".
# CodeQL bundle pin lives in codeql-signals.yml (that BC owns the pin).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gates:
    name: Python gates
    uses: ./.github/workflows/python-gates.yml

  codeql-signals:
    name: CodeQL signals
    uses: ./.github/workflows/codeql-signals.yml

  quality-gates:
    name: quality-gates
    needs: python-gates
    uses: ./.github/workflows/quality-gates.yml

  abi-tests:
    name: ABI domain tests
    uses: ./.github/workflows/abi-tests.yml

  sonarcloud:
    name: "SonarCloud (non-blocking; Free QG not policy SoT)"
    needs: python-gates
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
