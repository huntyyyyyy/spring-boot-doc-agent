[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-engine"
version = "0.1.0"
description = "Language-agnostic documentation generation SDK for software repositories."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Doc Engine Team" },
]
keywords = ["documentation", "static-analysis", "spring-boot", "codeql", "ast-grep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pathspec",
    "sqllineage>=1.5.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ast-grep-cli>=0.45.0",
]

[project.urls]
Homepage = "https://github.com/example/doc-engine"
Documentation = "https://example.github.io/doc-engine"
Repository = "https://github.com/example/doc-engine.git"

[project.scripts]
doc-engine = "doc_engine.cli:main"
stf = "stf.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["doc_engine*", "stf*"]

[tool.setuptools.package-data]
doc_engine = ["scanning/resources/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "domain_schemas: Artifact schemas, serde, and shape validators",
    "domain_stage0: Stage-0 signals, covering, gap_probe, facts/ETL",
    "domain_pipeline: Partition, capacity, pipeline stages, local_runner units",
    "domain_compliance: Compliance profiles and certification report units",
    "domain_ci_meta: CI scripts, ratchets, coverage meta tests",
    "domain_adapters: Adapter package tests",
    "domain_stf: STF package tests",
    "domain_climb_sensor: Coverage climb sensor suites (not oracle SoT)",
    "domain_integration: Kitchen-sink / certified e2e / shared artifact env",
    "domain_live_optin: Live OCS / real-world scans (skip-gated)",
    "domain_unclassified: Explicit serial bucket until reclassified (E-TEST T3)",
]

[tool.coverage.run]
source = ["doc_engine", "stf"]
branch = true
# Relative paths so SonarScanner on GitHub Actions can resolve coverage.xml
# filenames against the checkout (absolute runner paths do not match).
relative_files = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# Integer floor of combined statement+branch Cover% on a clean CI run.
# Aligned with new-code diff-cover (98.7); XML line-rate alone is not the gate.
fail_under = 98.7
show_missing = true
skip_empty = true
